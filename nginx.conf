# Substrate-Website origin.
#
# Serves the Astro/Starlight static build. Reached ONLY through the
# cloudflared tunnel (and localhost for health checks) — never published to
# the internet, so no TLS here: the tunnel terminates TLS at Cloudflare's
# edge and pulls from this container over the tunnel connection.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro fingerprints everything under /_astro/ with a content hash, so
    # those files can never go stale. Cache them forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Same for hashed assets in public/ that Astro copies verbatim.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML must always be revalidated, or a redeploy looks like it failed.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    # Starlight's search index and Pagefind assets, if present.
    location ^~ /pagefind/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Do not serve dotfiles from the web root.
    location ~ /\. { deny all; }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
